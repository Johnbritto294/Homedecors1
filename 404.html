<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Manrope:wght@300;500;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#F6F1E7;
  --ink:#1B1918;
  --brass:#B08D57;
  --charcoal:#1B1918;
  --forest:#3C4A3C;
  --line:rgba(246,241,231,.12);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Manrope',Helvetica,Arial,sans-serif;
  --font-mono:'Space Mono',monospace;
}
html{scroll-behavior:smooth;overscroll-behavior:none}
body{font-family:var(--font-body);background:var(--ink);color:var(--cream);line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border-radius:4px;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .3s;border:none}
.btn-primary{background:var(--brass);color:var(--ink)}
.btn-primary:hover{background:#c9a26e;transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn-outline:hover{border-color:var(--brass);color:var(--brass);transform:translateY(-1px)}

.error-section{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden}
.error-section::before{content:"";position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(176,141,87,.1);top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 60s linear infinite}
.error-section::after{content:"";position:absolute;width:700px;height:700px;border-radius:50%;border:1px solid rgba(176,141,87,.05);top:50%;left:50%;transform:translate(-50%,-50%);animation:spin 80s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.error-inner{position:relative;z-index:1}
.error-code{font-family:var(--font-display);font-size:clamp(100px,18vw,200px);font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(176,141,87,.25);margin-bottom:24px;letter-spacing:-.04em}
.error-code span{display:block;font-size:clamp(10px,2vw,16px);font-family:var(--font-mono);letter-spacing:.2em;text-transform:uppercase;-webkit-text-stroke:none;color:rgba(246,241,231,.3);margin-top:12px}
.error-title{font-family:var(--font-display);font-size:clamp(24px,4vw,40px);font-weight:500;margin-bottom:16px;color:var(--cream)}
.error-desc{font-size:15px;color:rgba(246,241,231,.5);max-width:420px;margin:0 auto 40px;line-height:1.7}
.error-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.error-divider{width:1px;height:24px;background:var(--line);align-self:center}

.particle{position:absolute;border-radius:50%;background:var(--brass);opacity:.08;animation:float 20s infinite ease-in-out}
.particle:nth-child(1){width:6px;height:6px;top:20%;left:15%;animation-delay:0s}
.particle:nth-child(2){width:4px;height:4px;top:60%;left:80%;animation-delay:-5s}
.particle:nth-child(3){width:8px;height:8px;top:75%;left:25%;animation-delay:-10s}
.particle:nth-child(4){width:3px;height:3px;top:30%;left:70%;animation-delay:-15s}
.particle:nth-child(5){width:5px;height:5px;top:85%;left:55%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}25%{transform:translateY(-30px) translateX(15px)}50%{transform:translateY(-10px) translateX(-20px)}75%{transform:translateY(-40px) translateX(10px)}}
</style>
</head>
<body>

<section class="error-section">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="error-inner">
    <div class="error-code">404<span>Page Not Found</span></div>
    <h1 class="error-title">This page doesn't exist.</h1>
    <p class="error-desc">The page you're looking for might have been moved, renamed, or doesn't exist anymore. Let's get you back on track.</p>
    <div class="error-actions">
      <button class="btn btn-primary" onclick="if(document.referrer && document.referrer.indexOf(location.hostname)!==-1){history.back();}else{window.location.href='index.html';}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Go Back
      </button>
      <div class="error-divider"></div>
      <a href="index.html" class="btn btn-outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
    </div>
  </div>
</section>

</body>
</html>
